name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 21098 "${{ secrets.FTP_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload public/ via rsync over SSH
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -e rsync -az --itemize-changes -e "ssh -p 21098" \
            ./public/ \
            "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_SERVER_DIR }}"
